name: Trip reminders
# Calls the deployed app so reminders go out even when nobody opens it.
# Needs repository secrets APP_URL (e.g. https://tripmate.example.com, no trailing slash) and CRON_SECRET (same value as the app's CRON_SECRET).
on:
  schedule:
    - cron: "17 * * * *" # hourly
  workflow_dispatch:
jobs:
  reminders:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Call /api/cron/reminders
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL / CRON_SECRET secrets are not set; skipping."
            exit 0
          fi
          curl --fail-with-body -sS --max-time 60 --retry 2 -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/reminders"
